<!DOCTYPE html>
<html lang="en">
<head>

        </div>

            <a class="projects" href="#Projects">Projects</a>

                <div class="contact_cards">
                    <div class=" contact_card email">
                        <a href="mailto:senudinubro@gmail.com">
                            <img src="resources/Icons/email.png" tag="email-icon">
                            <h3>Email</h3>
                        </a>
                    </div>
                    <div class="contact_card LinedIn">
                        <a href="https://www.linkedin.com/in/senuka-dinuwara/">

                            <h3>LinkedIn</h3>
                        </a>
                    </div>
                    <div class="contact_card Instagram">
                        <a href="https://www.instagram.com/codespectral/profilecard/?igsh=c2gwbncxMWVnZDR3">
                            <img src="resources/Icons/instagram.png" tag="instagram-icon">
                            <h3>Instagram</h3>
                        </a>
                    </div>
                </div>
            </div>
        </div>
